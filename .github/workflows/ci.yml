name: CI

on:
  push:
    branches: [main, version2]
  pull_request:
    branches: [main, version2]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Install project
        run: poetry install --no-interaction

      - name: Run ruff linter
        run: poetry run ruff check . --output-format=github

      - name: Run ruff format check
        run: poetry run ruff format . --check

      - name: Run mypy
        run: poetry run mypy --strict app tests

      - name: Run tests
        env:
          MONGO_OPS_MONGODB_URI: mongodb://localhost:27017
          MONGO_OPS_REDIS_URL: redis://localhost:6379/0
          MONGO_OPS_TELEGRAM_TOKEN: dummy
          MONGO_OPS_TELEGRAM_CHAT_ID: "-100"
          MONGO_OPS_BACKUP_BASE_PATH: ./backups
        run: poetry run pytest -q --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
